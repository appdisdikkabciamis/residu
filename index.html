<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Residu Kab. Ciamis</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#1C4E8C',   // Dapodik Royal Blue (hsl 213 67% 33%)
                        secondary: '#4787C7', // Dapodik Sky Blue (hsl 210 52% 53%)
                        accent: '#0D2754',    // Dapodik Deep Navy (hsl 217 73% 19%)
                        dark: '#0B1F41',      // Dapodik Foreground (hsl 217 70% 15%)
                        surface: '#EFF8FC',   // Dapodik Ice Blue Background (hsl 198 70% 97%)
                        textGray: '#3E5274'   // Dapodik Muted Foreground (hsl 217 30% 35%)
                    }
                }
            }
        }

        // Check if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>

    <style>
        body {
            background-color: #F3F6FA;
        }

        .dark body {
            background-color: #0B1324;
        }

        .login-hero-bg {
            background-color: #1455A6;
        }

        .dark .login-hero-bg {
            background-color: #0D2D5E;
        }
    </style>
</head>

<body class="relative min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Top Blue Dotted Banner Background (Interactive Dots) -->
    <div id="heroBanner" class="login-hero-bg fixed inset-x-0 top-0 h-[42vh] z-0 pointer-events-none transition-colors duration-300 overflow-hidden">
        <canvas id="heroDotsCanvas" class="w-full h-full block"></canvas>
    </div>

    <div
        class="relative z-10 w-full max-w-[400px] bg-white dark:bg-slate-800 rounded-2xl p-7 shadow-[0_14px_40px_rgba(15,45,94,0.12)] border border-gray-100 dark:border-slate-700">
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-7">
            <div class="w-[52px] h-[52px] rounded-[13px] bg-[#1455A6] text-white flex items-center justify-center shadow-md mb-3.5">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
                    <path d="M9 18h6"></path>
                    <path d="M10 22h4"></path>
                    <path d="M9.5 8.5l1.8 1.8 3.2-3.3"></path>
                </svg>
            </div>
            <h1 class="text-[22px] font-extrabold text-dark dark:text-white tracking-[0.12em] text-center">DATA RESIDU
            </h1>
            <p class="text-xs font-bold text-dark dark:text-white uppercase tracking-widest mt-1 text-center">KABUPATEN
                CIAMIS</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-[13px] font-bold text-dark dark:text-slate-300 mb-1.5">Username</label>
                <input type="text" id="username" required
                    class="w-full px-4 py-2.5 text-sm bg-[#EBF1FA] dark:bg-slate-900 border border-[#D5E0F2] dark:border-slate-700 rounded-xl text-dark dark:text-white focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-[#1455A6]/40 font-medium transition-all"
                    placeholder="Masukkan username">
            </div>
            <div>
                <label class="block text-[13px] font-bold text-dark dark:text-slate-300 mb-1.5">Password</label>
                <div class="relative w-full">
                    <input type="password" id="password" required
                        class="w-full px-4 py-2.5 pr-11 text-sm bg-[#EBF1FA] dark:bg-slate-900 border border-[#D5E0F2] dark:border-slate-700 rounded-xl text-dark dark:text-white focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-[#1455A6]/40 font-medium transition-all"
                        placeholder="Masukkan password">
                    <button type="button" onclick="togglePassword()"
                        class="absolute inset-y-0 right-0 flex items-center justify-center px-3.5 text-textGray hover:text-[#1455A6] dark:hover:text-sky-400 transition-colors focus:outline-none"
                        title="Tampilkan/Sembunyikan Password">
                        <i id="togglePassIcon" data-feather="eye" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMsg"
                class="hidden text-red-500 text-xs font-bold text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 text-sm bg-[#1455A6] hover:bg-[#0F4385] text-white font-bold rounded-xl shadow-md hover:shadow-lg transition-all flex justify-center items-center gap-2">
                <span>Masuk ke Dasbor</span>
                <i data-feather="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-7 text-center text-xs font-semibold text-textGray dark:text-slate-400">
            &copy; 2026 Dinas Pendidikan Kabupaten Ciamis.
        </div>
    </div>

    <!-- Theme Toggle Floating -->
    <button onclick="toggleTheme()"
        class="fixed bottom-6 right-6 flex items-center justify-center w-12 h-12 rounded-full bg-white dark:bg-slate-800 text-dark dark:text-white shadow-lg border border-gray-100 dark:border-slate-700 hover:scale-105 transition-transform"
        title="Toggle Dark Mode">
        <i id="themeToggleIcon" data-feather="moon" class="w-5 h-5"></i>
    </button>

    <script>
        feather.replace();

        // Theme management
        function applyTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeToggleIcon').setAttribute('data-feather', 'sun');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeToggleIcon').setAttribute('data-feather', 'moon');
            }
            feather.replace();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            applyTheme();
        }
        applyTheme();

        // Interactive & Animated Dots on Blue Banner
        (function initHeroDots() {
            const canvas = document.getElementById('heroDotsCanvas');
            const banner = document.getElementById('heroBanner');
            if (!canvas || !banner) return;
            const ctx = canvas.getContext('2d');
            const SPACING = 24;
            const INFLUENCE_RADIUS = 115;
            const MAX_PUSH = 16;
            let dots = [];
            let width = 0;
            let height = 0;
            let dpr = window.devicePixelRatio || 1;
            const mouse = { x: -9999, y: -9999 };

            function buildGrid() {
                dpr = window.devicePixelRatio || 1;
                width = banner.clientWidth;
                height = banner.clientHeight;
                canvas.width = width * dpr;
                canvas.height = height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                dots = [];
                const cols = Math.ceil(width / SPACING) + 1;
                const rows = Math.ceil(height / SPACING) + 1;
                const offsetX = (width - (cols - 1) * SPACING) / 2;
                const offsetY = (height - (rows - 1) * SPACING) / 2;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const ox = offsetX + c * SPACING;
                        const oy = offsetY + r * SPACING;
                        dots.push({
                            ox,
                            oy,
                            x: ox,
                            y: oy,
                            vx: 0,
                            vy: 0,
                            phase: (c * 0.35) + (r * 0.45)
                        });
                    }
                }
            }

            window.addEventListener('resize', buildGrid);
            window.addEventListener('mousemove', (e) => {
                const rect = banner.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            });
            window.addEventListener('mouseleave', () => {
                mouse.x = -9999;
                mouse.y = -9999;
            });

            function animate(now) {
                const t = now * 0.0018;
                const isDark = document.documentElement.classList.contains('dark');
                const baseAlpha = isDark ? 0.14 : 0.22;

                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < dots.length; i++) {
                    const d = dots[i];
                    // Gerakan gelombang halus terus-menerus
                    const waveX = Math.sin(t + d.phase) * 1.3;
                    const waveY = Math.cos(t * 0.85 + d.phase) * 1.3;
                    let targetX = d.ox + waveX;
                    let targetY = d.oy + waveY;

                    // Reaksi menjauh & menyala saat kursor mendekat
                    const dx = targetX - mouse.x;
                    const dy = targetY - mouse.y;
                    const distSq = dx * dx + dy * dy;
                    let proximity = 0;

                    if (distSq < INFLUENCE_RADIUS * INFLUENCE_RADIUS && distSq > 0.01) {
                        const dist = Math.sqrt(distSq);
                        proximity = 1 - dist / INFLUENCE_RADIUS;
                        const push = proximity * proximity * MAX_PUSH;
                        targetX += (dx / dist) * push;
                        targetY += (dy / dist) * push;
                    }

                    // Efek pegas halus kembali ke posisi
                    d.vx = (d.vx + (targetX - d.x) * 0.12) * 0.78;
                    d.vy = (d.vy + (targetY - d.y) * 0.12) * 0.78;
                    d.x += d.vx;
                    d.y += d.vy;

                    const radius = 1.5 + proximity * 1.6;
                    const alpha = Math.min(0.85, baseAlpha + proximity * 0.5);

                    ctx.beginPath();
                    ctx.arc(d.x, d.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                }

                requestAnimationFrame(animate);
            }

            buildGrid();
            requestAnimationFrame(animate);
        })();

        // Password visibility toggle
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePassIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-feather', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-feather', 'eye');
            }
            feather.replace();
        }

        // Constants (Perbarui URL ini jika Anda membuat deployment Web App Apps Script baru)
        const API_URL = "https://script.google.com/macros/s/AKfycbyk__dcHj_Zm_boKZOlRL_xdeXsAfBvnqFzMw3veXsO_xfndtn_g-PJdd6IKKib85l7/exec";

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorMsg');
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'login');
                formData.append('username', u);
                formData.append('password', p);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const resText = await response.text();
                const result = JSON.parse(resText);

                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', result.role || 'user');
                    localStorage.setItem('username', result.username || u);
                    window.location.href = 'dashboard.html';
                } else {
                    err.innerText = result.message || "Gagal login.";
                    err.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                err.innerText = "Terjadi kesalahan jaringan atau CORS.";
                err.classList.remove('hidden');
            } finally {
                btn.innerHTML = `<span>Masuk ke Dasbor</span><i data-feather="arrow-right" class="w-4 h-4"></i>`;
                feather.replace();
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
