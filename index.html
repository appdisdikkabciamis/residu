<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data ATS Kab. Ciamis</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#118263',
                        dark: '#1e293b',
                        surface: '#f8fafc',
                        textGray: '#64748b'
                    }
                }
            }
        }
        
        // Check if already logged in
        if (localStorage.getItem('isLoggedIn') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
    
    <style>
        body { background-color: #f1f5f9; }
        .dark body { background-color: #0f172a; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-slate-700">
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-14 h-14 rounded-[14px] bg-primary text-white flex items-center justify-center shadow-lg mb-4">
                <i data-feather="users" class="w-7 h-7"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-dark dark:text-white tracking-tight text-center">DATA ANAK TIDAK SEKOLAH</h1>
            <p class="text-xs font-bold text-dark dark:text-white uppercase tracking-widest mt-1 text-center">KABUPATEN CIAMIS</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-dark dark:text-slate-300 mb-2">Username</label>
                <input type="text" id="username" required 
                       class="w-full px-4 py-3 bg-surface dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl text-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 font-medium transition-all" 
                       placeholder="Masukkan username">
            </div>
            <div>
                <label class="block text-sm font-bold text-dark dark:text-slate-300 mb-2">Password</label>
                <div class="relative w-full">
                    <input type="password" id="password" required 
                           class="w-full px-4 py-3 pr-12 bg-surface dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-xl text-dark dark:text-white focus:outline-none focus:ring-2 focus:ring-primary/50 font-medium transition-all" 
                           placeholder="Masukkan password">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center justify-center px-4 text-textGray hover:text-primary dark:hover:text-primary transition-colors focus:outline-none" title="Tampilkan/Sembunyikan Password">
                        <i id="togglePassIcon" data-feather="eye" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="hidden text-red-500 text-sm font-bold text-center bg-red-50 dark:bg-red-900/20 py-2 rounded-lg"></div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-primary hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition-all flex justify-center items-center gap-2">
                <span>Masuk ke Dasbor</span>
                <i data-feather="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>
        
        <div class="mt-8 text-center text-xs font-semibold text-textGray dark:text-slate-400">
            &copy; 2026 Dinas Pendidikan Kabupaten Ciamis.
        </div>
    </div>

    <!-- Theme Toggle Floating -->
    <button onclick="toggleTheme()" class="fixed bottom-6 right-6 flex items-center justify-center w-12 h-12 rounded-full bg-white dark:bg-slate-800 text-dark dark:text-white shadow-lg border border-gray-100 dark:border-slate-700 hover:scale-105 transition-transform" title="Toggle Dark Mode">
        <i id="themeToggleIcon" data-feather="moon" class="w-5 h-5"></i>
    </button>

    <script>
        feather.replace();

        // Theme management
        function applyTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('themeToggleIcon').setAttribute('data-feather', 'sun');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('themeToggleIcon').setAttribute('data-feather', 'moon');
            }
            feather.replace();
        }

        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
            applyTheme();
        }
        applyTheme();

        // Password visibility toggle
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('togglePassIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-feather', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-feather', 'eye');
            }
            feather.replace();
        }

        // Constants
        const API_URL = "https://script.google.com/macros/s/AKfycbyPiDhGrCE8gvDQzggC56Eq_myGe2GYYnvEIr_XaGsfw9BNoIRB1CoW4EQWmG0yBEU8/exec";

        // Login Logic
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const err = document.getElementById('errorMsg');
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            btn.disabled = true;
            err.classList.add('hidden');

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'login');
                formData.append('username', u);
                formData.append('password', p);

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const resText = await response.text();
                const result = JSON.parse(resText);

                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userRole', result.role || 'user');
                    localStorage.setItem('username', u);
                    window.location.href = 'dashboard.html';
                } else {
                    err.innerText = result.message || "Gagal login.";
                    err.classList.remove('hidden');
                }
            } catch (error) {
                console.error(error);
                err.innerText = "Terjadi kesalahan jaringan atau CORS.";
                err.classList.remove('hidden');
            } finally {
                btn.innerHTML = `<span>Masuk ke Dasbor</span><i data-feather="arrow-right" class="w-4 h-4"></i>`;
                feather.replace();
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
